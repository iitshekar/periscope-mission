<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Periscope Mission – Year 6 Physics Simulation</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#1d2433;--muted:#5b6475;--brand:#c62828;--accent:#1565c0;--ok:#2e7d32;--bad:#c62828;--warn:#e67e00;--line:#dde3ec}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
svg text{font-family:"Segoe UI",system-ui,Roboto,Arial,sans-serif}
header{background:#fff;border-bottom:4px solid var(--brand);padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;position:sticky;top:0;z-index:30}
header h1{font-size:1.15rem;margin:0}
header .sub{font-size:.8rem;color:var(--muted)}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.toggles button{border:1px solid var(--line);background:#f7f9fc;border-radius:99px;padding:6px 12px;font-size:.85rem;cursor:pointer}
.toggles button.off{opacity:.55;text-decoration:line-through}
#steps{display:flex;gap:4px;flex-wrap:wrap;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:62px;z-index:29}
#steps span{font-size:.75rem;padding:4px 10px;border-radius:99px;background:#eef1f6;color:var(--muted)}
#steps span.done{background:#e3f2e5;color:var(--ok)}
#steps span.now{background:var(--brand);color:#fff;font-weight:600}
main{max-width:1180px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:14px;box-shadow:0 2px 10px rgba(20,30,60,.07);padding:18px}
.grid{display:grid;grid-template-columns:minmax(280px,1fr) minmax(300px,1fr);gap:16px;align-items:start}
.grid.wide{grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr)}
@media(max-width:820px){.grid,.grid.wide{grid-template-columns:1fr}}
h2{margin:.1em 0 .4em;font-size:1.3rem;color:var(--brand)}
h3{margin:.2em 0 .3em}
.lead{color:var(--muted)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-size:1rem;cursor:pointer;font-weight:600}
.btn:disabled{background:#9fb3c8!important;color:#fff!important;cursor:not-allowed}
.btn.green{background:var(--ok)}
.btn.light{background:#eef3fa;color:var(--accent)}
.btn.red{background:var(--bad)}
.btn.on{background:#f9a825;color:#3a2a00}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
input[type=text]{padding:10px;border:1px solid var(--line);border-radius:8px;font-size:1rem;width:100%}
label.f{display:block;font-weight:600;margin:10px 0 4px}
#scopeCard{padding:8px;position:sticky;top:120px}
#scope{width:100%;height:auto;max-height:calc(100vh - 150px);display:block;margin:auto;touch-action:none;border-radius:10px}
#scope .part .real{opacity:0;transition:opacity .4s}
#scope .part.placed .real{opacity:1}
#scope .part.placed .ghost{display:none}
#scope .ghost{fill:rgba(120,130,150,.07);stroke:#8a94a6;stroke-dasharray:5 4;stroke-width:1.5}
#scope .part.glow .ghost{stroke:#ffb300;stroke-dasharray:none;animation:blink .5s 6 alternate}
#scope .lab{display:none;font-size:12px;font-weight:600;fill:#263238}
#scope .lab line{stroke:#546e7a;stroke-width:1}
#scope .lab.on{display:block}
#scope.nolabels .lab{display:none}
#scope .mg.glow .ghost{display:block!important}
@keyframes blink{from{stroke-width:1.5}to{stroke-width:6}}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;margin:12px 0}
.piece{background:#fafbfd;border:2px solid var(--line);border-radius:10px;padding:6px;text-align:center;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;font-size:.82rem;font-weight:600}
.piece:hover{border-color:#90caf9}
.piece.sel{border-color:var(--accent);background:#e3f2fd}
.piece .ico{width:100%;height:46px;display:block;margin-bottom:3px;pointer-events:none}
.dragghost{position:fixed;pointer-events:none;z-index:100;transform:translate(-50%,-50%) scale(1.1);opacity:.92;box-shadow:0 6px 18px rgba(0,0,0,.25);width:105px}
.msg{min-height:1.6em;font-weight:600;padding:6px 10px;border-radius:8px}
.msg.good{background:#e8f5e9;color:var(--ok)}
.msg.bad{background:#fdecea;color:var(--bad)}
.msg.info{background:#e3f2fd;color:var(--accent)}
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.85rem;margin:6px 0}
.chain span{background:#e8f5e9;color:var(--ok);padding:3px 8px;border-radius:99px;font-weight:600}
.chain span.q{background:#fff3e0;color:var(--warn)}
.mcq .q{font-weight:700;font-size:1.05rem;margin:6px 0 10px}
.mcq .fig svg{width:100%;max-width:380px;height:auto;display:block;margin:0 auto 8px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.98rem;cursor:pointer;font-family:inherit;color:inherit}
.opt:hover:not(:disabled){border-color:#90caf9;background:#f5faff}
.opt b{display:inline-block;width:1.6em;color:var(--accent)}
.opt.sel{border-color:var(--accent);background:#e3f2fd}
.opt.right{border-color:var(--ok);background:#e8f5e9}
.opt.wrong{border-color:var(--bad);background:#fdecea;opacity:.75;cursor:not-allowed}
.fb{margin-top:8px;padding:8px 10px;border-radius:8px;display:none}
.fb.good,.fb.bad,.fb.hint{display:block}
.fb.good{background:#e8f5e9;color:var(--ok)}
.fb.bad{background:#fdecea;color:var(--bad)}
.fb.hint{background:#fff8e1;color:#8a5a00}
.conf{margin-top:10px;display:none}
.conf.show{display:block}
.conf button{border:2px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;margin:3px;cursor:pointer;font:inherit}
.conf button.sel{border-color:var(--accent);background:#e3f2fd}
.info{background:#f7f9fc;border-left:5px solid var(--brand);border-radius:8px;padding:10px 14px;margin:10px 0}
.sandbox{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;border:2px dashed #ffb74d;border-radius:12px;background:#fffaf0;margin:10px 0}
#beam{width:80px;cursor:grab;touch-action:none}
.locked{opacity:.35;pointer-events:none;filter:grayscale(.7)}
.sim{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#fff;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
input[type=range]{width:100%}
.readout{background:#f7f9fc;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:.95rem}
.checks{font-size:.9rem;color:var(--muted);margin-top:6px}
.checks .yes{color:var(--ok);font-weight:600}
.rag{display:flex;gap:6px;margin:6px 0 14px}
.rag button{flex:1;border:2px solid var(--line);border-radius:10px;padding:8px;background:#fff;cursor:pointer;font-weight:600;font:inherit}
.rag button.r.sel{background:#ef5350;color:#fff;border-color:#ef5350}
.rag button.a.sel{background:#ffb300;color:#fff;border-color:#ffb300}
.rag button.g.sel{background:#43a047;color:#fff;border-color:#43a047}
.tip{font-size:.85rem;color:var(--muted)}
.complete{background:#e8f5e9;border:2px solid #a5d6a7;border-radius:12px;padding:12px 14px;margin:10px 0}
.complete b{color:var(--ok)}
.lockmsg{font-size:.85rem;color:var(--muted);margin-top:6px}
.rotrow{display:none}
.rotrow.show{display:flex}
.stat{font-size:.92rem;color:var(--muted)}
.stat b{color:var(--ink)}
.banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:#fff;border:3px solid var(--ok);color:var(--ok);font-weight:800;font-size:1.6rem;padding:12px 24px;border-radius:14px;box-shadow:0 6px 20px rgba(20,30,60,.2);text-align:center;white-space:nowrap;animation:pop .45s ease-out;z-index:5}
.banner small{display:block;font-size:.9rem;color:var(--ink);font-weight:600}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.6);opacity:0}}
.wrapR{position:relative}
.eyeview{width:100%;max-width:300px;display:block;margin:6px auto}
.modal{position:fixed;inset:0;background:rgba(20,30,60,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal .box{background:#fff;border-radius:14px;padding:20px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal .box h3{color:var(--brand)}
/* report */
#report h2{margin-top:0}
.rhead{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:.95rem;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.kpi{background:#f7f9fc;border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
.kpi .v{font-size:1.5rem;font-weight:800}
.kpi .l{font-size:.8rem;color:var(--muted)}
.band{display:inline-block;white-space:nowrap;font-size:.8rem;padding:3px 10px;border-radius:99px;font-weight:700;color:#fff}
.band.above{background:#2e7d32}.band.inline{background:#1565c0}.band.below{background:#c62828}
table.sc{width:100%;border-collapse:collapse;font-size:.92rem;margin:8px 0}
table.sc td,table.sc th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.bar{height:12px;background:#eceff4;border-radius:99px;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;border-radius:99px}
.pill{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;font-weight:700}
.pill.R{background:#ef5350;color:#fff}.pill.A{background:#ffb300;color:#fff}.pill.G{background:#43a047;color:#fff}
ul.tight{margin:4px 0;padding-left:20px}
details{margin-top:10px}
@media print{header,#steps,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <pattern id="bricks" width="30" height="16" patternUnits="userSpaceOnUse"><rect width="30" height="16" fill="#c4583a"/><path d="M0 0H30M0 8H30M15 0V8M0 8V16M30 8V16" stroke="#f1d8c8" stroke-width="1.6"/></pattern>
 <pattern id="wood" width="60" height="16" patternUnits="userSpaceOnUse"><rect width="60" height="16" fill="#8a5a36"/><path d="M0 15H60M30 0V15" stroke="#6b4426" stroke-width="2"/></pattern>
 <pattern id="grain" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#c58b4b"/><path d="M0 6 Q6 3 12 6" stroke="#a46c33" stroke-width="1.2" fill="none"/></pattern>
 <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e3e8f0"/><line x1="0" y1="0" x2="0" y2="8" stroke="#7d8aa8" stroke-width="2.5"/></pattern>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3ff"/><stop offset="1" stop-color="#eef8ff"/></linearGradient>
 <linearGradient id="armySky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb0c2"/><stop offset="1" stop-color="#dfe5ea"/></linearGradient>
 <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9f6ff"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#b9d9ef"/></linearGradient>
 <linearGradient id="tubeG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#26a69a"/><stop offset=".5" stop-color="#4db6ac"/><stop offset="1" stop-color="#00897b"/></linearGradient>
 <radialGradient id="tableGlow"><stop offset="0" stop-color="#fff3b0" stop-opacity=".95"/><stop offset=".6" stop-color="#ffd84d" stop-opacity=".45"/><stop offset="1" stop-color="#ffd84d" stop-opacity="0"/></radialGradient>
 <radialGradient id="vignette"><stop offset=".72" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></radialGradient>
 <filter id="glowY" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffd000" flood-opacity=".9"/></filter>
</defs></svg>
<header>
  <div>
    <h1>🔭 The Periscope Mission: Reflection Lab</h1>
    <div class="sub">Year 6 Physics · Reflection of Light &amp; Periscopes · Interactive simulation with assessment</div>
  </div>
  <div class="toggles noprint">
    <button id="tSound" title="Sound effects">🔊 Sound</button>
    <button id="tVoice" title="Read explanations aloud">🗣️ Voice</button>
    <button id="tRestart" title="Restart this level">↺ Restart level</button>
    <button id="tReset" title="Start the whole activity again">⟲ Reset all</button>
  </div>
</header>
<div id="steps"></div>
<main id="main"></main>

<script>
'use strict';
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs={},html=''){const e=document.createElement(tag);for(const k in attrs){if(k==='class')e.className=attrs[k];else e.setAttribute(k,attrs[k]);}if(html)e.innerHTML=html;return e;}
function S_(tag,attrs,parent){const e=document.createElementNS(NS,tag);if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function T_(p,x,y,t,a){const e=S_('text',Object.assign({x,y},a||{}),p);e.textContent=t;return e;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const normDeg=a=>((a%360)+360)%360;
const fmtT=s=>{s=Math.round(s);return s<60?`${s} s`:`${Math.floor(s/60)} min ${s%60} s`;};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function svgPtOf(svg,cx,cy){const p=svg.createSVGPoint();p.x=cx;p.y=cy;return p.matrixTransform(svg.getScreenCTM().inverse());}
function animateVal(dur,fn,done){const t0=performance.now();const st=t=>{const k=clamp((t-t0)/dur,0,1),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;fn(e);if(k<1)requestAnimationFrame(st);else done&&done();};requestAnimationFrame(st);}
function svgDrag(svg,target,{start,move,end}){target.addEventListener('pointerdown',e=>{if(start&&start(e)===false)return;e.preventDefault();const p0=svgPtOf(svg,e.clientX,e.clientY);
  const mv=ev=>{const p=svgPtOf(svg,ev.clientX,ev.clientY);move(p.x-p0.x,p.y-p0.y,p);};
  const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);end&&end();};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);});}

/* ============ state (saved, so a refresh never skips ahead) ============ */
const KEY='periscopeMission.v2';
function freshState(){return {stage:0,name:'',cls:'',start:0,end:0,pre:[],exit:[],items:[],mis:[],hints:[],refl:{},lv:{}};}
let S;try{S=JSON.parse(localStorage.getItem(KEY));}catch(e){}
if(!S||typeof S!=='object'||!Array.isArray(S.items))S=freshState();
let soundOn=true,voiceOn=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function record(sc,correct,label){S.items.push({lv:S.stage,sc,correct:!!correct,label});save();}
function misc(m){if(m&&!S.mis.some(x=>x.m===m))S.mis.push({lv:S.stage,m});save();}
function useHint(){S.hints.push(S.stage);save();}

/* ============ sound (Web Audio, no files) ============ */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,{type='sine',vol=.2,t=0,f2=null}={}){const c=ac();if(!c||!soundOn)return;const o=c.createOscillator(),g=c.createGain(),s=c.currentTime+t;o.type=type;o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(vol,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g).connect(c.destination);o.start(s);o.stop(s+d+.05);}
const SFX={
 click(){tone(660,.07,{vol:.12});},
 pick(){tone(520,.06,{vol:.12,type:'triangle'});},
 snap(){tone(420,.08,{vol:.2,type:'triangle'});tone(840,.14,{vol:.15,t:.06});},
 correct(){tone(660,.15,{vol:.2});tone(880,.28,{vol:.2,t:.12});},
 wrong(){tone(190,.25,{type:'square',vol:.07});tone(140,.3,{type:'square',vol:.07,t:.13});},
 zap(){tone(1200,.25,{f2:500,vol:.1,type:'triangle'});},
 shine(){[880,1100,1320,1760].forEach((f,i)=>tone(f,.16,{vol:.07,t:i*.07}));},
 click2(){tone(300,.05,{vol:.15,type:'square'});},
 fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,.3,{vol:.16,type:'triangle',t:i*.13}));tone(1047,.7,{vol:.14,t:.55});}
};
/* voice */
let voice=null;
function pickVoice(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en[-_]GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();if(!voiceOn||!t)return;const u=new SpeechSynthesisUtterance(t.replace(/<[^>]+>/g,''));if(voice)u.voice=voice;u.rate=.95;speechSynthesis.speak(u);}
$('#tSound').onclick=()=>{soundOn=!soundOn;$('#tSound').classList.toggle('off',!soundOn);if(soundOn)SFX.click();};
$('#tVoice').onclick=()=>{voiceOn=!voiceOn;$('#tVoice').classList.toggle('off',!voiceOn);if(!voiceOn&&'speechSynthesis' in window)speechSynthesis.cancel();};

/* ============ steps bar + level locking ============ */
const STEPS=['Start','Pre-check','1 Build','2 Light Journey','3 Lab','4 Apply','5 Trench','Exit check','Reflect','Report'];
function setStep(i){$('#steps').innerHTML=STEPS.map((s,j)=>`<span class="${j<i?'done':j===i?'now':''}">${j<i?'✓ ':j>i?'🔒 ':''}${s}</span>`).join('');window.scrollTo({top:0,behavior:'smooth'});
 $('#tRestart').style.display=(i>=1&&i<=7)?'':'none';}
const main=$('#main');
let cleanups=[];const onClean=f=>cleanups.push(f);
function clear(){main.innerHTML='';if('speechSynthesis' in window)speechSynthesis.cancel();cleanups.forEach(f=>{try{f();}catch(e){}});cleanups=[];}
function go(i){S.stage=i;save();clear();setStep(i);SCREENS[i]();}
/* restarting a level wipes only that level's data, then starts it fresh */
function purge(i){S.items=S.items.filter(x=>x.lv!==i);S.mis=S.mis.filter(x=>x.lv!==i);S.hints=S.hints.filter(x=>x!==i);delete S.lv[i];if(i===1)S.pre=[];if(i===7)S.exit=[];if(i===8)S.refl={};}
function restartLevel(i){purge(i);go(i);}
function modal(title,text,yes,onYes){const m=el('div',{class:'modal'},`<div class="box"><h3>${title}</h3><p>${text}</p><div class="row"><button class="btn light" data-a="n">Cancel</button><button class="btn red" data-a="y">${yes}</button></div></div>`);document.body.appendChild(m);
 m.onclick=e=>{const a=e.target.dataset&&e.target.dataset.a;if(!a&&e.target!==m)return;m.remove();if(a==='y')onYes();};}
$('#tRestart').onclick=()=>modal('↺ Restart this level?','Your work in this level will be cleared. Earlier levels are kept.','Restart level',()=>restartLevel(S.stage));
$('#tReset').onclick=()=>modal('⟲ Reset everything?','This clears all levels, the reflection and the report card, and goes back to the start.','Reset all',()=>{S=freshState();save();go(0);});
/* "level complete" box: the only way forward */
function levelDone(box,text,nextLabel){S.lv[S.stage]=Object.assign(S.lv[S.stage]||{},{done:true});save();SFX.fanfare();
 box.insertAdjacentHTML('beforeend',`<div class="complete">✅ <b>${STEPS[S.stage]} complete!</b> ${text||''}</div><div class="row"><button class="btn green" id="nextLv">${nextLabel||('Unlock '+STEPS[S.stage+1]+' ➜')}</button></div>`);
 const b=$('#nextLv');b.onclick=()=>go(S.stage+1);b.scrollIntoView({behavior:'smooth',block:'center'});}
function lvData(){return S.lv[S.stage]=S.lv[S.stage]||{};}

/* ============ success criteria ============ */
const SCN={SC1:'I can identify the incident ray, the reflected ray and the normal.',SC2:'I can identify angle i and angle r, and explain that i = r.',SC3:'I can explain how a plane mirror changes the direction of light.',SC4:'I can explain how a periscope uses two mirrors to see over obstacles.'};
const SCS={SC1:'Rays & the normal',SC2:'Angles i, r and i = r',SC3:'Mirrors change the direction of light',SC4:'How a periscope works'};

/* ============ ray diagram (used in questions) ============ */
function wedge(cx,cy,r,a1,a2,sw){return `M ${cx} ${cy} L ${cx+r*Math.cos(a1)} ${cy+r*Math.sin(a1)} A ${r} ${r} 0 0 ${sw} ${cx+r*Math.cos(a2)} ${cy+r*Math.sin(a2)} Z`;}

  T_(side,160,16,raised?'Light: scout → top mirror → bottom mirror → eye':'The trench wall blocks the light!',{'text-anchor':'middle','font-size':12,'font-weight':800,fill:'#1d2433'});}
 function upd(){per.setAttribute('transform',`translate(${px} 0)`);bags.style.display=raised?'none':'';pano.setAttribute('transform',`translate(${160-cxOf()} -170)`);}
 function setRaise(v){if(anim)return;anim=true;const a=raised?-110:0,b=v?-110:0;raised=v;animateVal(500,e=>upg.setAttribute('transform',`translate(0 ${a+(b-a)*e})`),()=>{anim=false;upd();});
  $('#rs').textContent=raised?'⬇ Lower periscope':'⬆ Raise periscope';redrawSide();km(raised?'🔭 The periscope is above the trench wall. Search left and right, behind the bushes!':'The periscope is lowered – you can only see sandbags.','info');}
 const move=dx=>{if(found)return;const a=px,b=clamp(px+dx,60,580);animateVal(250,e=>{px=a+(b-a)*e;upd();});};
 $('#sl').onclick=()=>move(-45);$('#sr').onclick=()=>move(45);$('#rs').onclick=()=>{SFX.click();setRaise(!raised);};
 let sx;svgDrag(svg,perHit,{start:()=>{if(found)return false;sx=px;},move:dx=>{px=clamp(sx+dx,60,580);upd();}});
 const key=e=>{if(e.key==='ArrowLeft'){move(-45);e.preventDefault();}if(e.key==='ArrowRight'){move(45);e.preventDefault();}};window.addEventListener('keydown',key);onClean(()=>window.removeEventListener('keydown',key));
 $('#pk').onclick=()=>{peeks++;SFX.wrong();peekG.innerHTML='';T_(peekG,320,200,'🚫 Too high to see over!',{'text-anchor':'middle','font-size':30,'font-weight':900,fill:'#fff',stroke:'#7a1d1d','stroke-width':1.2});setTimeout(()=>peekG.innerHTML='',1600);
  km('🚫 The wall is much taller than you, and light travels in <b>straight lines</b> – it cannot reach your eye over the wall. That is exactly why soldiers used periscopes!','bad');};
 $('#lk').onclick=()=>{if(found)return;
  if(!raised){low++;SFX.wrong();km('You can only see sandbags! 💡 <b>Raise the periscope</b> above the trench wall first.','bad');return;}
  const cx=cxOf();
  if(Math.abs(cx-TX)<40){found=true;const tm=(Date.now()-t0)/1000;SFX.fanfare();flash.textContent='🎯 TARGET LOCATED!';ch.querySelectorAll('*').forEach(e=>e.setAttribute('stroke','#22e07a'));
   left.appendChild(el('div',{class:'banner',style:'top:30%'},'🎯 Target located!<small>📸 Position photographed &amp; radioed to HQ · +100 points</small>'));
   km('✅ Light from the scout entered the top of your periscope, <b>reflected off the top mirror</b> down the tube, then <b>off the bottom mirror</b> into your eye. You saw over the wall while staying safely below it.','good');
   speak('Target located! The periscope let you see over the trench wall by reflecting light twice.');
   panel.querySelectorAll('.row button').forEach(b=>b.disabled=true);
   record('SC4',wrong===0&&low===0,'Trench: locate the target with the periscope');Object.assign(lvData(),{found:true,time:Math.round(tm),wrong,low,peeks});save();
   mcq($('#kQ'),{sc:'SC4',q:'How did the periscope let you see the scout?',hint:'Think about the two mirrors and the wall.',opts:[{t:'Light from the scout reflected off the top mirror, then the bottom mirror, into my eye – so it went over the wall',ok:1},{t:'My eye sent light out to find the scout',mis:'Thinks light travels from the eye to the object',fb:'Light travels FROM the scout INTO your eye.'},{t:'The light went through the sandbags',fb:'Sandbags block light.'},{t:'The periscope made the scout bigger',mis:'Thinks periscope mirrors make the image bigger',fb:'Plane mirrors do not make things bigger – they change the direction of light.'}]},
    {title:'Explain it',label:'Trench: explain the periscope',onDone:()=>levelDone($('#kQ'),'Now prove what you have learnt in the exit check.')});return;}
  wrong++;SFX.wrong();km(Math.abs(cx-RX-60)<60?'🐇 That\'s just a rabbit! Keep searching.':'Nothing in your crosshairs yet. 💡 Look for a <b>helmet</b> peeking over a bush and put it in the <b>middle</b> of the red circle.','bad');};
 km('Press <b>⬆ Raise periscope</b> to start.','info');upd();redrawSide();}
}

/* ============ SCREEN 8: reflect ============ */
function screenReflect(){
 const c=el('div',{class:'card'});c.innerHTML=`<h2>Reflect: how far can I say…</h2><p class="lead">Be honest! Red = not yet, Amber = partly, Green = confident.</p><div id="rf"></div><div class="row"><button class="btn green" id="toRep" disabled>See my report card ➜</button></div>`;
 main.appendChild(c);speak('Reflect. For each success criterion, choose red, amber or green.');
 const rf=$('#rf');Object.keys(SCN).forEach(sc=>{const d=el('div',{},`<div><b>${SCN[sc]}</b></div>`);const r=el('div',{class:'rag'});
  [['R','r','🔴 Not yet'],['A','a','🟠 Partly'],['G','g','🟢 Confident']].forEach(([v,cl,t])=>{const b=el('button',{class:cl},t);b.onclick=()=>{r.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');S.refl[sc]=v;save();SFX.click();$('#toRep').disabled=Object.keys(S.refl).length<4;};r.appendChild(b);});
  d.appendChild(r);rf.appendChild(d);});
 $('#toRep').onclick=()=>{S.end=Date.now();S.lv[8]={done:true};save();SFX.fanfare();go(9);};
}

/* ============ SCREEN 9: report ============ */
const BANDS={above:75,inline:50};
function band(p){return p>=BANDS.above?['above','Above expectations']:p>=BANDS.inline?['inline','In line with expectations']:['below','Below expectations'];}
const NEXT={SC1:'Draw a ray diagram and label the incident ray, reflected ray and normal. Remember: incident goes IN to the mirror, reflected comes OFF it.',SC2:'Use a protractor to draw three rays hitting a mirror at different angles. Measure i and r from the NORMAL each time and check that i = r.',SC3:'Redo Level 4: before you move the mirror, predict where the reflected light will go using i = r.',SC4:'Draw a labelled periscope with both 45° mirrors and the light path from the object to the eye, then explain it to a partner.'};
function screenReport(){
 const sc={};Object.keys(SCN).forEach(k=>{const it=S.items.filter(i=>i.sc===k),c=it.filter(i=>i.correct).length;sc[k]={n:it.length,c,p:it.length?Math.round(100*c/it.length):0};});
 const overall=Math.round(Object.values(sc).reduce((a,b)=>a+b.p,0)/4),[bc,bt]=band(overall);
 const pre=S.pre.filter(x=>x.ok).length,ex=S.exit.filter(x=>x.ok).length,gain=ex-pre;
 const prog=(pre===6&&ex===6)?'Secure – already knew this; ready for extension':gain>=3?'Significant progress':gain===2?'Good progress':gain===1?'Some progress':(pre>=5&&ex>=5)?'Secure – maintained a high score':'Limited progress – needs review';
 const overconf=S.exit.filter(x=>x.conf==='sure'&&!x.ok).length,underconf=S.exit.filter(x=>x.conf!=='sure'&&x.ok).length;
 const mins=Math.max(1,Math.round(((S.end||Date.now())-S.start)/60000));
 const colr=p=>p>=75?'#2e7d32':p>=50?'#1565c0':'#c62828';
 const L=S.lv,b1=L[2]||{},a4=L[5]||{},t5=L[6]||{};
 const lvItems=i=>S.items.filter(x=>x.lv===i),lvFirst=i=>{const it=lvItems(i);return `${it.filter(x=>x.correct).length} / ${it.length}`;};
 const rows=Object.keys(SCN).map(k=>{const r=S.refl[k],p=sc[k].p;let note='';if(r==='G'&&p<50)note='You felt confident, but your answers show this needs more work.';else if(r==='R'&&p>=75)note='You are doing better than you think!';
  return `<tr><td><b>${SCS[k]}</b><div class="tip">${SCN[k]}</div></td><td style="min-width:120px"><div class="bar"><i style="width:${p}%;background:${colr(p)}"></i></div><b>${p}%</b> <span class="tip">(${sc[k].c}/${sc[k].n})</span> <span class="band ${band(p)[0]}">${band(p)[1]}</span></td><td><span class="pill ${r}">${r==='R'?'Red':r==='A'?'Amber':'Green'}</span><div class="tip">${note}</div></td></tr>`;}).join('');
 const weak=Object.keys(sc).filter(k=>sc[k].p<75),strong=Object.keys(sc).filter(k=>sc[k].p>=75);
 const mis=[...new Set(S.mis.map(x=>x.m))];
 const nm=esc(S.name);
 let sum=`${nm} is working <b>${bt.toLowerCase()}</b> for this topic (overall mastery ${overall}%). They scored ${pre}/6 in the pre-check and ${ex}/6 in the exit check (${gain>0?'+':''}${gain}). `;
 sum+=b1.auto&&b1.auto.length?`They built the periscope with ${b1.auto.length} part${b1.auto.length>1?'s':''} placed for them (${b1.auto.join(', ').toLowerCase()}), placing ${b1.firstTry}/7 parts correctly first time. `:`They built the periscope independently, placing ${b1.firstTry??0}/7 parts correctly first time. `;
 sum+=`They lit the dining table in ${a4.tableAttempts||'–'} attempt${a4.tableAttempts===1?'':'s'}, solved all three mirror-challenge stages in ${a4.tentTurns??'–'} mirror turns, and located the trench target in ${t5.time!=null?fmtT(t5.time):'–'}${t5.wrong?` after ${t5.wrong} incorrect lock-on${t5.wrong>1?'s':''}`:' with the first lock-on'}. `;
 if(strong.length)sum+=`Strongest area: ${strong.map(k=>SCS[k].toLowerCase()).join(', ')}. `;
 if(mis.length)sum+=`Misconception${mis.length>1?'s':''} to address: ${mis.slice(0,2).map(m=>m.charAt(0).toLowerCase()+m.slice(1)).join('; ')}. `;
 sum+=weak.length?`Further practice is recommended for ${weak.map(k=>SCS[k].toLowerCase()).join(' and ')}.`:'All success criteria are secure – ready for an extension task.';
 const c=el('div',{class:'card',id:'report'});
 c.innerHTML=`<h2>📋 YEAR 6 PHYSICS – PERISCOPE MISSION REPORT</h2>
 <div class="rhead"><span><b>Name:</b> ${nm}</span><span><b>Class:</b> ${esc(S.cls)}</span><span><b>Date:</b> ${new Date().toLocaleDateString('en-GB')}</span><span><b>Topic:</b> Reflection of Light &amp; Periscopes</span><span><b>Time taken:</b> ${mins} min</span></div>
 <div class="kpis">
  <div class="kpi"><div class="l">Overall attainment</div><div class="v" style="color:${colr(overall)}">${overall}%</div><span class="band ${bc}">${bt}</span></div>
  <div class="kpi"><div class="l">Pre-check (baseline)</div><div class="v">${pre}/6</div></div>
  <div class="kpi"><div class="l">Exit check</div><div class="v">${ex}/6</div></div>
  <div class="kpi"><div class="l">Progress</div><div class="v" style="color:${gain>0?'#2e7d32':gain<0?'#c62828':'#1d2433'}">${gain>0?'+':''}${gain}</div><div class="l">${prog}</div></div>
  <div class="kpi"><div class="l">Hints used</div><div class="v">${S.hints.length}</div><div class="l">fewer hints = more independent</div></div>
 </div>
 <h3>Mission performance</h3>
 <table class="sc"><tr><th>Level</th><th>Score / result</th><th>Attempts</th><th>Status</th></tr>
  <tr><td><b>Level 1 – Build the periscope</b></td><td>${b1.firstTry??0}/7 parts first time · quiz ${S.items.filter(x=>x.lv===2&&x.label.startsWith('Build quiz')&&x.correct).length}/3 first try${b1.auto&&b1.auto.length?`<div class="tip">Placed for the student: ${b1.auto.join(', ')}</div>`:''}</td><td>${b1.attempts??'–'}</td><td>✅ Complete</td></tr>
  <tr><td><b>Level 2 – Light Journey</b></td><td>${lvFirst(3)} questions correct first try</td><td>–</td><td>✅ Complete</td></tr>
  <tr><td><b>Level 3 – Virtual Lab</b></td><td>${lvFirst(4)} predictions / explanations correct first try</td><td>–</td><td>✅ Complete</td></tr>
  <tr><td><b>Level 4 – Apply</b></td><td>Table lit in ${a4.tableTime!=null?fmtT(a4.tableTime):'–'} · Mirror challenge: 3/3 stages, ${a4.tentTurns??'–'} turns${a4.tent?`<div class="tip">${a4.tent.map(t=>`Stage ${t.stage}: ${t.turns} turns (fewest ${t.opt})`).join(' · ')}</div>`:''}</td><td>${a4.tableAttempts??'–'} light checks</td><td>✅ Complete</td></tr>
  <tr><td><b>Level 5 – Trench periscope</b></td><td>Target located in ${t5.time!=null?fmtT(t5.time):'–'}${t5.low?'<div class="tip">Needed a reminder to raise the periscope</div>':''}</td><td>${(t5.wrong||0)+1} lock-on${t5.wrong?'s':''}</td><td>✅ Complete</td></tr>
 </table>
 <h3>Success criteria – attainment vs self-assessment</h3>
 <table class="sc"><tr><th>Success criterion</th><th>Mastery (first try)</th><th>My rating</th></tr>${rows}</table>
 <h3>Misconceptions to fix</h3>${mis.length?`<ul class="tight">${mis.map(m=>`<li>${m}</li>`).join('')}</ul>`:'<p>None detected – excellent! 🎉</p>'}
 <h3>Confidence check (exit)</h3><p>Sure but wrong: <b>${overconf}</b> · Correct but unsure: <b>${underconf}</b></p>
 <h3>Strengths</h3>${strong.length?`<ul class="tight">${strong.map(k=>`<li><b>${SCS[k]}:</b> ${SCN[k].replace('I can','Can')}</li>`).join('')}</ul>`:'<p>Keep going – every success criterion is still developing.</p>'}
 <h3>My next steps</h3>${weak.length?`<ul class="tight">${weak.map(k=>`<li><b>${SCS[k]}:</b> ${NEXT[k]}</li>`).join('')}</ul>`:'<p>All success criteria secure. Extension: <i>Design a periscope that uses THREE mirrors to see around a corner and over a wall. Draw the light path and mark i and r at each mirror.</i></p>'}
 <h3>Teacher summary</h3><div class="info">${sum}</div>
 <details><summary>Question-by-question detail (for teacher)</summary><table class="sc"><tr><th>Item</th><th>SC</th><th>First try</th></tr>
  ${S.pre.map((x,i)=>`<tr><td>Pre-check ${i+1}: ${x.q} <span class="tip">(${x.conf})</span></td><td>${x.sc}</td><td>${x.ok?'✅':'❌'}</td></tr>`).join('')}
  ${S.items.map(x=>`<tr><td>${x.label}</td><td>${x.sc}</td><td>${x.correct?'✅':'❌'}</td></tr>`).join('')}</table></details>
 <p class="tip">Attainment bands: ${BANDS.above}%+ Above · ${BANDS.inline}–${BANDS.above-1}% In line · below ${BANDS.inline}% Below expectations. Mastery counts first-attempt answers without hints. Progress = exit check − pre-check.</p>
 <div class="row noprint"><button class="btn" id="pr">🖨️ Print / Save as PDF</button><button class="btn green" id="dl">⬇️ Download report</button><button class="btn light" id="again">↺ Start again</button></div>`;
 main.appendChild(c);
 speak(`Well done ${S.name}. Your overall attainment is ${overall} percent, ${bt}. You improved from ${pre} to ${ex} out of six.`);
 $('#pr').onclick=()=>window.print();
 $('#dl').onclick=()=>{const css=document.querySelector('style').textContent;const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Periscope report – ${esc(S.name)}</title><style>${css}</style></head><body><main>${c.outerHTML}</main></body></html>`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=`Periscope_Report_${S.cls}_${S.name}`.replace(/[^\w\-]+/g,'_')+'.html';document.body.appendChild(a);a.click();a.remove();};
 $('#again').onclick=()=>modal('↺ Start again?','This clears this student\'s results so a new student can begin.','Start again',()=>{S=freshState();save();go(0);});
}

/* ============ boot ============ */
const SCREENS=[screenStart,()=>screenTest('pre'),screenBuild,screenJourney,screenLab,screenApply,screenTrench,()=>screenTest('exit'),screenReflect,screenReport];
(function boot(){const i=S.stage|0;
 if(i>=1&&i<=8&&!(S.lv[i]&&S.lv[i].done))restartLevel(i);
 else if(i>=1&&i<=8&&S.lv[i]&&S.lv[i].done)go(i+1);
 else go(i>=0&&i<=9?i:0);})();
</script>
